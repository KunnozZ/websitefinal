<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivid Weather App</title>
    <!-- นำเข้า Tailwind CSS และ Icon -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="weather-clear"> <!-- class นี้จะเปลี่ยนไปตามอากาศ -->

    <div class="main-container min-h-screen flex items-center justify-center p-4">
        <div class="glass-card max-w-5xl w-full p-8 shadow-2xl relative overflow-hidden">
            
            <!-- ส่วนบน: ค้นหาและเวลา -->
            <div class="flex flex-wrap justify-between items-center mb-8 gap-4">
                <div class="search-box flex-1 min-w-[250px]">
                    <input type="text" id="cityInput" placeholder="ค้นหาเมืองทั่วโลก..." 
                        class="w-full bg-white/10 border border-white/20 rounded-full py-3 px-6 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/30">
                </div>
                <div class="text-right">
                    <div id="real-time-clock" class="text-2xl font-light">00:00:00</div>
                    <div id="current-date" class="text-xs opacity-70 uppercase tracking-widest">Monday, 1 Jan</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <!-- ฝั่งซ้าย: สภาพอากาศหลัก -->
                <div class="lg:col-span-1 text-center lg:text-left animate-fade-in">
                    <h1 id="city-name" class="text-4xl font-bold mb-2">---</h1>
                    <div class="flex items-center justify-center lg:justify-start">
                        <span id="main-temp" class="text-9xl font-black tracking-tighter">0</span>
                        <span class="text-4xl font-light mt-4">°C</span>
                    </div>
                    <p id="weather-status" class="text-2xl font-medium opacity-90 mt-2">Loading...</p>
                </div>

                <!-- ฝั่งขวา: รายละเอียด (Grid) -->
                <div class="lg:col-span-2 grid grid-cols-2 sm:grid-cols-4 gap-4 animate-slide-up">
                    <div class="stat-card">
                        <i data-lucide="droplets" class="mb-2"></i>
                        <span class="text-xs opacity-60">ความชื้น</span>
                        <div class="text-xl font-bold"><span id="humidity">0</span>%</div>
                    </div>
                    <div class="stat-card">
                        <i data-lucide="wind" class="mb-2"></i>
                        <span class="text-xs opacity-60">แรงลม</span>
                        <div class="text-xl font-bold"><span id="wind">0</span> km/h</div>
                    </div>
                    <div class="stat-card">
                        <i data-lucide="eye" class="mb-2"></i>
                        <span class="text-xs opacity-60">ทัศนวิสัย</span>
                        <div class="text-xl font-bold"><span id="visibility">0</span> km</div>
                    </div>
                    <div class="stat-card">
                        <i data-lucide="thermometer" class="mb-2"></i>
                        <span class="text-xs opacity-60">รู้สึกเหมือน</span>
                        <div class="text-xl font-bold"><span id="feels-like">0</span>°</div>
                    </div>
                    
                    <!-- แผนที่แบบกระจก -->
                    <div class="col-span-2 sm:col-span-4 mt-4">
                        <div id="map" class="rounded-3xl h-[250px] border border-white/10"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
