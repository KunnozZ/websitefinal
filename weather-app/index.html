<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather & Interactive Map</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen p-4 md:p-8 flex items-center justify-center">

    <div class="main-container max-w-7xl w-full glass rounded-[2.5rem] overflow-hidden flex flex-col lg:flex-row shadow-2xl">
        
        <!-- ฝั่งซ้าย: ข้อมูลอากาศ (Sidebar) -->
        <aside class="lg:w-[380px] p-8 flex flex-col gap-6 border-r border-white/10 bg-black/20">
            <!-- ค้นหา -->
            <div class="relative">
                <i data-lucide="map-pin" class="absolute left-4 top-3.5 w-5 h-5 text-gray-400"></i>
                <input type="text" id="citySearch" placeholder="ค้นหาเมือง..." 
                    class="w-full bg-white/10 border border-white/10 py-3 pl-12 pr-4 rounded-2xl outline-none focus:bg-white/20 transition text-white">
            </div>

            <!-- ข้อมูลหลัก -->
            <div class="text-center py-6">
                <h1 class="text-8xl font-light" id="temp-main">28°</h1>
                <h2 class="text-3xl font-medium mt-2" id="desc-main">Rainy Day</h2>
                <p class="text-gray-400 text-sm mt-4 leading-relaxed" id="summary">
                    ตรวจสอบสภาพอากาศและแผนที่แบบเรียลไทม์ได้ที่นี่
                </p>
            </div>

            <!-- การ์ดข้อมูล 4 อันด้านล่าง -->
            <div class="grid grid-cols-2 gap-3">
                <div class="stat-card-small">
                    <span class="text-[10px] text-gray-400 uppercase">Feels Like</span>
                    <div class="text-xl font-bold" id="feels-like">30°</div>
                </div>
                <div class="stat-card-small">
                    <span class="text-[10px] text-gray-400 uppercase">Precipitation</span>
                    <div class="text-xl font-bold">2.3"</div>
                </div>
                <div class="stat-card-small">
                    <span class="text-[10px] text-gray-400 uppercase">Visibility</span>
                    <div class="text-xl font-bold" id="visibility">6 mi</div>
                </div>
                <div class="stat-card-small">
                    <span class="text-[10px] text-gray-400 uppercase">Humidity</span>
                    <div class="text-xl font-bold" id="humidity">82%</div>
                </div>
            </div>
        </aside>

        <!-- ฝั่งขวา: แผนที่ขนาดใหญ่พร้อมปุ่มควบคุม -->
        <main class="flex-1 relative bg-black/40 p-6 flex flex-col">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-xl font-bold flex items-center gap-2">
                    <i data-lucide="map" class="w-6 h-6"></i> 🗺️ แผนที่พยากรณ์
                </h3>
                <!-- ปุ่มเลือก Layer แผนที่ -->
                <div class="flex gap-2 flex-wrap">
                    <button onclick="changeLayer('precipitation_new')" class="btn-layer">🌧️ ฝน</button>
                    <button onclick="changeLayer('clouds_new')" class="btn-layer">☁️ เมฆ</button>
                    <button onclick="changeLayer('temp_new')" class="btn-layer">🌡️ อุณหภูมิ</button>
                    <button onclick="changeLayer('wind_new')" class="btn-layer">💨 ลม</button>
                </div>
            </div>

            <!-- ตัวแผนที่ -->
            <div id="map" class="flex-1 rounded-3xl overflow-hidden border border-white/20 shadow-inner"></div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
